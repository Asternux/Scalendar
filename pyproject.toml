[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalendar"
version = "1.0.0.dev0"
description = "A local Windows timetable-to-calendar desktop workspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "openai>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
build = [
    "pyinstaller>=6,<7",
]

[project.scripts]
scalendar = "scalendar.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
