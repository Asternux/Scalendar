name: Scalendar CI

on:
  push:
    branches:
      - main
      - rewrite/v1
  pull_request:
    branches:
      - main
      - rewrite/v1

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -e ".[test]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q src tests

