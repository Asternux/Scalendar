name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable EXE
        shell: pwsh
        run: .\tools\build_windows.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Scalendar-windows-x64
          path: build/dist/Scalendar
          if-no-files-found: error
          retention-days: 14
